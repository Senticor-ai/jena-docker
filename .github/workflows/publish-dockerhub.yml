---
name: Publish to Docker Hub

# This workflow is disabled by default (workflow_dispatch only)
# To enable automatic publishing, uncomment the 'on' triggers below
# and add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets to your repository

on:
  workflow_dispatch:  # Manual trigger only
  # Uncomment below to enable automatic publishing:
  # push:
  #   branches:
  #     - main
  #   tags:
  #     - 'v*'
  # release:
  #   types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        image:
          - name: jena
            context: ./jena
            dockerfile: ./jena/Dockerfile
          - name: jena-fuseki
            context: ./jena-fuseki
            dockerfile: ./jena-fuseki/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.image.name }}" in
            jena)
              VERSION=$(grep -m1 'ENV[[:space:]]\+JENA_VERSION' jena/Dockerfile | cut -d= -f2 | tr -d '"' | tr -d "[:space:]")
              ;;
            jena-fuseki)
              VERSION=$(grep -m1 'ENV[[:space:]]\+FUSEKI_VERSION' jena-fuseki/Dockerfile | cut -d= -f2 | tr -d '"' | tr -d "[:space:]")
              ;;
            *)
              echo "Unknown image name: ${{ matrix.image.name }}" >&2
              exit 1
              ;;
          esac
          if [ -z "${VERSION:-}" ]; then
            echo "Unable to determine version for ${{ matrix.image.name }}" >&2
            exit 1
          fi
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          {
            echo "version=$VERSION"
            echo "major=$MAJOR"
            echo "minor=$MINOR"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
