---
name: Security and Compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  source-scans:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint Dockerfiles with Hadolint
        shell: bash
        run: |
          set -euo pipefail
          for dockerfile in jena/Dockerfile jena-fuseki/Dockerfile; do
            docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < "$dockerfile"
          done

      - name: Install ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Lint shell scripts with ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          shellcheck -S warning \
            build-and-push.sh \
            .github/scripts/*.sh \
            jena-fuseki/docker-entrypoint.sh \
            jena-fuseki/load.sh \
            jena-fuseki/tdbloader \
            jena-fuseki/tdbloader2 \
            tests/*.sh

      - name: Install Trivy CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.69.3

      - name: Scan repository for misconfiguration
        shell: bash
        run: |
          set -euo pipefail
          trivy fs \
            --scanners misconfig \
            --skip-dirs .git \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output trivy-repository.sarif \
            --exit-code 1 \
            .

      - name: Upload repository scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-repository.sarif') != ''
        with:
          sarif_file: trivy-repository.sarif
          category: trivy-repository

  image-scans:
    needs: source-scans
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: jena
            context: ./jena
            dockerfile: ./jena/Dockerfile
          - name: jena-fuseki
            context: ./jena-fuseki
            dockerfile: ./jena-fuseki/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          load: true
          tags: ${{ matrix.image.name }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.69.3

      - name: Run Trivy vulnerability scan
        shell: bash
        run: |
          set -euo pipefail
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output trivy-${{ matrix.image.name }}.sarif \
            --exit-code 1 \
            ${{ matrix.image.name }}:scan

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image.name }}.sarif
          category: trivy-${{ matrix.image.name }}

      - name: Export JSON vulnerability report
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output trivy-${{ matrix.image.name }}.json \
            ${{ matrix.image.name }}:scan

      - name: Upload JSON vulnerability report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-${{ matrix.image.name }}-report
          path: trivy-${{ matrix.image.name }}.json
          retention-days: 30
