---
name: Security and Compliance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  source-scans:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Lint Dockerfiles with Hadolint
        shell: bash
        run: |
          set -euo pipefail
          for dockerfile in jena/Dockerfile jena-fuseki/Dockerfile; do
            docker run --rm -i hadolint/hadolint < "$dockerfile"
          done

      - name: Install ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Lint shell scripts with ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          shellcheck -S warning \
            build-and-push.sh \
            .github/scripts/*.sh \
            jena-fuseki/docker-entrypoint.sh \
            jena-fuseki/load.sh \
            jena-fuseki/tdbloader \
            jena-fuseki/tdbloader2

      - name: Scan repository for secrets and misconfiguration
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          format: sarif
          output: trivy-repository.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload repository scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-repository.sarif
          category: trivy-repository

  image-scans:
    needs: source-scans
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: jena
            context: ./jena
            dockerfile: ./jena/Dockerfile
          - name: jena-fuseki
            context: ./jena-fuseki
            dockerfile: ./jena-fuseki/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for scanning
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          load: true
          tags: ${{ matrix.image.name }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ matrix.image.name }}:scan
          format: sarif
          output: trivy-${{ matrix.image.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image.name }}.sarif
          category: trivy-${{ matrix.image.name }}

      - name: Export JSON vulnerability report
        uses: aquasecurity/trivy-action@v0.35.0
        if: always()
        with:
          image-ref: ${{ matrix.image.name }}:scan
          format: json
          output: trivy-${{ matrix.image.name }}.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload JSON vulnerability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-${{ matrix.image.name }}-report
          path: trivy-${{ matrix.image.name }}.json
          retention-days: 30
