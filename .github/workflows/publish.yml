---
name: Publish Container Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: jena
            context: ./jena
            dockerfile: ./jena/Dockerfile
          - name: jena-fuseki
            context: ./jena-fuseki
            dockerfile: ./jena-fuseki/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          load: true
          tags: ${{ matrix.image.name }}:smoke

      - name: Run Jena smoke test
        if: ${{ matrix.image.name == 'jena' }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 'ENV[[:space:]]\+JENA_VERSION' jena/Dockerfile | cut -d= -f2 | tr -d '"' | tr -d '[:space:]')
          docker run --rm jena:smoke riot --version | grep -F "$version"

      - name: Run Fuseki smoke test
        if: ${{ matrix.image.name == 'jena-fuseki' }}
        shell: bash
        run: |
          set -euo pipefail
          container_name="fuseki-smoke"
          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT

          docker run -d \
            --name "$container_name" \
            -p 127.0.0.1:3030:3030 \
            -e ADMIN_PASSWORD=smoke-test-password \
            jena-fuseki:smoke

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3030/\$/ping >/dev/null; then
              curl -fsS http://127.0.0.1:3030/ | grep -qi fuseki
              exit 0
            fi
            sleep 2
          done

          docker logs "$container_name"
          exit 1

  build-and-push:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    strategy:
      matrix:
        image:
          - name: jena
            context: ./jena
            dockerfile: ./jena/Dockerfile
          - name: jena-fuseki
            context: ./jena-fuseki
            dockerfile: ./jena-fuseki/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Normalize image owner
        id: owner
        shell: bash
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "value=$owner" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.image.name }}" in
            jena)
              version=$(grep -m1 'ENV[[:space:]]\+JENA_VERSION' jena/Dockerfile | cut -d= -f2 | tr -d '"' | tr -d '[:space:]')
              ;;
            jena-fuseki)
              version=$(grep -m1 'ENV[[:space:]]\+FUSEKI_VERSION' jena-fuseki/Dockerfile | cut -d= -f2 | tr -d '"' | tr -d '[:space:]')
              ;;
            *)
              echo "Unknown image name: ${{ matrix.image.name }}" >&2
              exit 1
              ;;
          esac

          if [ -z "${version:-}" ]; then
            echo "Unable to determine version for ${{ matrix.image.name }}" >&2
            exit 1
          fi

          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"

          {
            echo "value=$version"
            echo "major=$major"
            echo "minor=$minor"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}
            type=raw,value=${{ steps.version.outputs.major }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max

      - name: Install Syft
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOMs with Syft
        shell: bash
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image.name }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          env SYFT_CHECK_FOR_APP_UPDATE=0 syft scan "$IMAGE_REF" \
            --output "spdx-json=sbom-${{ matrix.image.name }}.spdx.json"
          env SYFT_CHECK_FOR_APP_UPDATE=0 syft scan "$IMAGE_REF" \
            --output "cyclonedx-json=sbom-${{ matrix.image.name }}.cdx.json"

      - name: Upload SPDX SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.image.name }}-spdx
          path: sbom-${{ matrix.image.name }}.spdx.json
          retention-days: 30

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.image.name }}-cyclonedx
          path: sbom-${{ matrix.image.name }}.cdx.json
          retention-days: 30

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/${{ matrix.image.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.image.name }}.spdx.json
          push-to-registry: true
