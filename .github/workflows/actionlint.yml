name: Lint GitHub Workflows
'on':
  push:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        shell: bash
        run: .github/scripts/lint-workflows.sh
