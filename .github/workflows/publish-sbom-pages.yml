---
name: Publish Supply-Chain Transparency Pages
run-name: >-
  Publish transparency content${{
    github.event_name == 'workflow_run'
    && format(' (from {0})', github.event.workflow_run.name)
    || github.event_name == 'workflow_dispatch'
    && ' (manual dispatch)'
    || ''
  }}

on:
  workflow_run:
    workflows: ["Publish Container Images"]
    types:
      - completed
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  download-and-publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release versions
        id: versions
        run: |
          set -euo pipefail
          JENA_VERSION=$(grep -m1 'ENV[[:space:]]\+JENA_VERSION' jena/Dockerfile | cut -d= -f2 | tr -d '"' | tr -d "[:space:]")
          FUSEKI_VERSION=$(grep -m1 'ENV[[:space:]]\+FUSEKI_VERSION' jena-fuseki/Dockerfile | cut -d= -f2 | tr -d '"' | tr -d "[:space:]")
          if [ -z "$JENA_VERSION" ] || [ -z "$FUSEKI_VERSION" ]; then
            echo "Unable to determine image versions" >&2
            exit 1
          fi
          echo "jena_version=$JENA_VERSION" >> "$GITHUB_OUTPUT"
          echo "fuseki_version=$FUSEKI_VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Install Cosign
        env:
          COSIGN_VERSION: v3.0.2
        run: |
          set -euo pipefail
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) ARCH="amd64" ;;
            aarch64|arm64) ARCH="arm64" ;;
            *) echo "Unsupported architecture: $ARCH" >&2; exit 1 ;;
          esac
          if [ "$OS" != "linux" ]; then
            echo "Unsupported OS: $OS" >&2
            exit 1
          fi
          INSTALL_DIR="$HOME/.cosign"
          mkdir -p "$INSTALL_DIR"
          curl -sSfL -o "$INSTALL_DIR/cosign" "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-${OS}-${ARCH}"
          chmod +x "$INSTALL_DIR/cosign"
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
          cosign version

      - name: Collect supply-chain evidence
        env:
          REGISTRY: ghcr.io/senticor-ai
          JENA_VERSION: ${{ steps.versions.outputs.jena_version }}
          FUSEKI_VERSION: ${{ steps.versions.outputs.fuseki_version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          IMAGETOOLS_OPTIONAL: 1
        run: .github/scripts/collect-supply-chain-evidence.sh

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'sbom-*'
          path: sbom-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create SBOM index page
        run: .github/scripts/generate-transparency-pages.sh
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
