---
name: Publish Supply-Chain Transparency Pages
run-name: >-
  Publish transparency content${{
    github.event_name == 'workflow_run'
    && format(' (from {0})', github.event.workflow_run.name)
    || github.event_name == 'workflow_dispatch'
    && ' (manual dispatch)'
    || ''
  }}

on:
  workflow_run:
    workflows: ["Publish Container Images"]
    types:
      - completed
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  download-and-publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release versions
        id: versions
        run: |
          set -euo pipefail
          JENA_VERSION=$(grep -m1 'ENV[[:space:]]\+JENA_VERSION' jena/Dockerfile | cut -d= -f2 | tr -d '"' | tr -d "[:space:]")
          FUSEKI_VERSION=$(grep -m1 'ENV[[:space:]]\+FUSEKI_VERSION' jena-fuseki/Dockerfile | cut -d= -f2 | tr -d '"' | tr -d "[:space:]")
          if [ -z "$JENA_VERSION" ] || [ -z "$FUSEKI_VERSION" ]; then
            echo "Unable to determine image versions" >&2
            exit 1
          fi
          echo "jena_version=$JENA_VERSION" >> "$GITHUB_OUTPUT"
          echo "fuseki_version=$FUSEKI_VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0
        with:
          cosign-release: 'v2.4.0'

      - name: Collect supply-chain evidence
        env:
          REGISTRY: ghcr.io/senticor-ai
          JENA_VERSION: ${{ steps.versions.outputs.jena_version }}
          FUSEKI_VERSION: ${{ steps.versions.outputs.fuseki_version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p supply-chain-data
          for image in jena jena-fuseki; do
            case "$image" in
              jena) version="$JENA_VERSION" ;;
              jena-fuseki) version="$FUSEKI_VERSION" ;;
              *) echo "Unknown image $image" >&2; exit 1 ;;
            esac
            ref="${REGISTRY}/${image}:${version}"
            fmt='{{json .Attestations}}'
            docker buildx imagetools inspect "$ref" --format "$fmt" > "supply-chain-data/${image}-attestations.json" 2>&1
            syft packages "$ref" -o spdx-json > "supply-chain-data/${image}-syft.spdx.json" 2>&1
            COSIGN_EXPERIMENTAL=1 cosign verify-attestation \
              --type slsaprovenance \
              --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.+" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "$ref" > "supply-chain-data/${image}-cosign.txt" 2>&1
          done

      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'sbom-*'
          path: sbom-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Create SBOM index page
        run: .github/scripts/generate-transparency-pages.sh
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
